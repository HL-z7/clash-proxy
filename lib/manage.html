<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>订阅管理</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --card:#171a21; --line:#262b35; --text:#e6e9ef; --dim:#8b93a3; --accent:#4f8cff; --danger:#ff6b6b; --ok:#5ad18a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:14px 14px 20px; background:var(--bg); color:var(--text); font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  h2 { font-size:13px; margin:0; color:var(--dim); font-weight:600; letter-spacing:.02em; }
  a { color:var(--accent); text-decoration:none; font-size:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1 1 240px; min-width:0; background:#0d1016; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 10px; font-size:12.5px; transition:border-color .15s ease; }
  input:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:12.5px; cursor:pointer; transition:opacity .15s ease,transform .12s ease; }
  button:hover:not(:disabled) { transform:translateY(-1px); }
  button:active:not(:disabled) { transform:translateY(0) scale(.985); }
  button:disabled { opacity:.45; cursor:default; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); padding:5px 9px; font-size:12px; }
  button.ghost:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button.small { padding:4px 8px; font-size:11.5px; }
  .listhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  ul { list-style:none; margin:0; padding:0; max-height:236px; overflow:auto; scrollbar-width:thin; }
  li { display:flex; align-items:center; gap:8px; padding:8px 2px; border-top:1px solid var(--line); animation:rowin .18s ease both; }
  li:first-child { border-top:0; }
  @keyframes rowin { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
  .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--dim); font-size:11.5px; white-space:nowrap; }
  .badge { font-size:10.5px; padding:1px 6px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .badge.on { color:var(--ok); border-color:rgba(90,209,138,.45); background:rgba(90,209,138,.08); }
  .acts { display:flex; gap:5px; flex-shrink:0; }
  .msg { margin:8px 0 0; font-size:12.5px; min-height:18px; transition:color .15s ease; }
  .msg.err { color:var(--danger); }
  .msg.ok { color:var(--ok); }
  .empty { color:var(--dim); font-size:12.5px; animation:none; }
  footer { color:var(--dim); font-size:11.5px; display:flex; justify-content:space-between; gap:8px; }
  .spin::after { content:'…'; animation:dots 1s steps(4,end) infinite; display:inline-block; width:1em; text-align:left; }
  @keyframes dots { from { content:''; } to { content:'…'; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>订阅管理</h1>
    <a href="./" id="back">返回面板 →</a>
  </header>

  <section class="card">
    <form id="form">
      <input id="url" placeholder="https:// 订阅地址（Clash 配置或分享链接）" autocomplete="off" spellcheck="false">
      <input id="label" placeholder="名称（可选）" autocomplete="off" style="flex:0 1 130px">
      <button id="submit" type="submit">导入</button>
    </form>
    <p class="msg" id="msg"></p>
  </section>

  <section class="card">
    <div class="listhead">
      <h2>已有订阅</h2>
      <button class="ghost small" id="refresh">全部更新</button>
    </div>
    <ul id="list"></ul>
  </section>

  <footer>
    <span id="status">加载中…</span>
    <span id="hint"></span>
  </footer>
</div>

<script>
(function () {
  var API = location.pathname.replace(/\/+$/, '') + '/subs'
  var $ = function (id) { return document.getElementById(id) }
  var msg = $('msg')

  /** 面板里是以浮层 iframe 打开的，点「关闭」通知父页面收起，别在 iframe 里跳走 */
  if (window.parent !== window) {
    var back = $('back')
    back.textContent = '关闭 ✕'
    back.href = 'javascript:void(0)'
    back.onclick = function () { window.parent.postMessage('pp-subs-close', '*') }
  }

  function show(text, kind) {
    msg.textContent = text || ''
    msg.className = 'msg' + (kind ? ' ' + kind : '')
  }

  async function post(path, body) {
    var res = await fetch(API + path, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body || {}),
    })
    var data = await res.json().catch(function () { return {} })
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status))
    return data
  }

  function ago(ts) {
    if (!ts) return ''
    var min = Math.round((Date.now() - ts) / 60000)
    if (min < 1) return '刚刚更新'
    if (min < 60) return min + ' 分钟前'
    var h = Math.round(min / 60)
    if (h < 24) return h + ' 小时前'
    return Math.round(h / 24) + ' 天前'
  }

  function button(text, cls, onclick) {
    var b = document.createElement('button')
    b.className = cls
    b.textContent = text
    b.onclick = onclick
    return b
  }

  function row(sub, busy) {
    var li = document.createElement('li')
    var badge = document.createElement('span')
    badge.className = 'badge' + (sub.active === false ? '' : ' on')
    badge.textContent = sub.active === false ? '未启用' : '使用中'
    var name = document.createElement('span')
    name.className = 'name'
    name.textContent = sub.label || sub.name
    name.title = sub.name
    var meta = document.createElement('span')
    meta.className = 'meta'
    meta.textContent = sub.count + ' 节点 · ' + (sub.kind === 'clash' ? 'Clash' : '分享链接') + (sub.updatedAt ? ' · ' + ago(sub.updatedAt) : '')
    var acts = document.createElement('div')
    acts.className = 'acts'
    if (sub.active === false) {
      acts.appendChild(button('切换', 'ghost small', function () { switchTo(sub, this) }))
    }
    acts.appendChild(button('更新', 'ghost small', function () { update(sub, this) }))
    acts.appendChild(button('改名', 'ghost small', function () { rename(sub, this) }))
    acts.appendChild(button('删除', 'ghost small', function () { remove(sub, this) }))
    if (busy) acts.querySelectorAll('button').forEach(function (b) { b.disabled = true })
    li.appendChild(badge); li.appendChild(name); li.appendChild(meta); li.appendChild(acts)
    return li
  }

  function render(data, busyKey) {
    var list = $('list')
    list.innerHTML = ''
    var subs = (data && data.subs) || []
    if (!subs.length) {
      var li = document.createElement('li')
      li.className = 'empty'
      li.textContent = '还没有订阅，先在上面粘贴一条订阅地址'
      list.appendChild(li)
    }
    subs.forEach(function (sub) { list.appendChild(row(sub, busyKey === sub.name)) })
    var st = (data && data.status) || {}
    $('status').textContent = st.version
      ? '内核 ' + st.version + ' · 模式 ' + (st.mode || '-') + ' · 节点 ' + (st.nodes ?? '-') + ' 个'
      : '内核未运行，启动后订阅才会生效'
  }

  async function load() {
    try {
      var res = await fetch(API, { headers: { accept: 'application/json' } })
      var data = await res.json()
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status))
      render(data)
    } catch (err) {
      show(err.message || String(err), 'err')
      $('status').textContent = '加载失败'
    }
  }

  function lock(btn, text) {
    btn.disabled = true
    btn.dataset.text = btn.textContent
    btn.textContent = text
  }

  function unlock(btn) {
    btn.disabled = false
    if (btn.dataset.text) btn.textContent = btn.dataset.text
  }

  async function switchTo(sub, btn) {
    lock(btn, '切换中')
    show('正在切换到「' + (sub.label || sub.name) + '」…')
    try {
      var data = await post('/switch', { key: sub.name })
      show('已切换到：' + (sub.label || sub.name), 'ok')
      render(data)
    } catch (err) {
      show(err.message || String(err), 'err')
      unlock(btn)
    }
  }

  async function update(sub, btn) {
    lock(btn, '更新中')
    show('正在重新拉取「' + (sub.label || sub.name) + '」…')
    try {
      var data = await post('/update', { key: sub.name })
      show('已更新：' + (sub.label || sub.name), 'ok')
      render(data)
    } catch (err) {
      show(err.message || String(err), 'err')
      unlock(btn)
    }
  }

  async function rename(sub, btn) {
    var next = prompt('给这条订阅起个名字', sub.label || '')
    if (next === null) return
    lock(btn, '保存中')
    try {
      var data = await post('/rename', { key: sub.name, label: next.trim() })
      show(next.trim() ? '已改名为：' + next.trim() : '已恢复默认名称', 'ok')
      render(data)
    } catch (err) {
      show(err.message || String(err), 'err')
      unlock(btn)
    }
  }

  async function remove(sub, btn) {
    if (!confirm('删除订阅「' + (sub.label || sub.name) + '」？')) return
    lock(btn, '删除中')
    try {
      var data = await post('/delete', { key: sub.name })
      show('已删除：' + (data.removed || sub.name), 'ok')
      render(data)
    } catch (err) {
      show(err.message || String(err), 'err')
      unlock(btn)
    }
  }

  $('refresh').onclick = async function () {
    var btn = this
    lock(btn, '更新中')
    show('正在更新全部订阅…')
    try {
      var data = await post('/update', { key: 'all' })
      show(data.failed && data.failed.length ? data.failed.join('；') : '全部订阅已更新', data.failed && data.failed.length ? 'err' : 'ok')
      render(data)
    } catch (err) {
      show(err.message || String(err), 'err')
      unlock(btn)
    } finally {
      unlock(btn)
    }
  }

  $('form').onsubmit = async function (ev) {
    ev.preventDefault()
    var url = $('url').value.trim()
    if (!url) return show('先粘贴订阅地址', 'err')
    $('submit').disabled = true
    show('正在拉取订阅…')
    try {
      var data = await post('', { url: url, label: $('label').value.trim() })
      $('url').value = ''
      $('label').value = ''
      show('已导入 ' + (data.entry.label || data.entry.name) + '，' + data.entry.count + ' 个节点', 'ok')
      render(data)
    } catch (err) {
      show(err.message || String(err), 'err')
    } finally {
      $('submit').disabled = false
    }
  }

  load()
})()
</script>
</body>
</html>
